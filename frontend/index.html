<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Icons ───────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ── PWA Manifest ────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ── Viewport (mobile-first, no user zoom, safe area) ───── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- ── Theme colours ───────────────────────────────────────── -->
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0ea5e9" media="(prefers-color-scheme: light)" />

    <!-- ── Android PWA ─────────────────────────────────────────── -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ── iOS PWA (Safari "Add to Home Screen") ───────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CleanVision" />

    <!-- ── SEO & Description ───────────────────────────────────── -->
    <meta name="description" content="CleanVision — AI-powered hospital bathroom cleanliness inspection and compliance platform for healthcare facility management." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- ── Open Graph (for sharing links) ─────────────────────── -->
    <meta property="og:title" content="CleanVision AI | Bathroom Inspection" />
    <meta property="og:description" content="AI-powered hospital bathroom cleanliness and hygiene compliance tracking." />
    <meta property="og:type" content="website" />

    <title>CleanVision AI | Bathroom Inspection</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
